name: CI

on:
  push:
    branches: [main, beta, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript lint dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint:js
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: 模块目录与接口依赖
        run: python scripts/check_architecture.py
      - name: Type check with example configuration
        run: |
          python -c "import shutil; shutil.copyfile('config.example.py', 'config.py')"
          pyright
      - name: Verify standalone WebUI preview is current
        run: python scripts/build_webui_preview.py --check

  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        exclude:
          # Windows 上只跑一个版本，避免矩阵膨胀
          - os: windows-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -v -o faulthandler_timeout=60

  browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix .browser-ci --no-audit --no-fund playwright@1.63.0
          .browser-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser interaction checks
        env:
          OOPTRA_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.browser-ci/node_modules/playwright
        run: |
          node tests/browser/webui.cjs
          node tests/browser/preview.cjs
          node tests/browser/screen-frame.cjs
          node tests/browser/screen-viewer-lifecycle.cjs
          node tests/browser/voice-volume.cjs
          node tests/browser/ui-audit.cjs
